<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Now Playing</title>
  <style>
    :root {
      --accent: #1DB954;
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.62);
      --glass: rgba(16, 16, 18, 0.78);
      --radius: 20px;
      --art-size: 76px;
      --card-width: 420px;
      --title-size: 16.5px;
      --artist-size: 13.5px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #card {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.96);
      width: var(--card-width);
      padding: 16px 18px 14px 16px;
      background: var(--glass);
      border-radius: var(--radius);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 24px 64px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex; flex-direction: column; gap: 14px;
      pointer-events: none;
      will-change: opacity, transform;
    }
    #card.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    #card.hidden { opacity: 0; transform: translate(-50%, -50%) scale(0.94); }
    .top { display: flex; align-items: center; gap: 16px; }
    .art-wrap {
      width: var(--art-size); height: var(--art-size);
      flex-shrink: 0; border-radius: 13px; overflow: hidden;
      position: relative; background: #0d0d0f;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    #art { width: 100%; height: 100%; object-fit: cover; display: none; }
    .art-placeholder {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 28%, #111), #111);
    }
    .art-placeholder svg { width: 30px; height: 30px; opacity: 0.8; fill: var(--accent); }
    .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    #title {
      font-size: var(--title-size); font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      letter-spacing: -0.025em; line-height: 1.3;
    }
    #artist {
      font-size: var(--artist-size); color: var(--text-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .controls { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
    .play-btn {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .play-btn svg { width: 13px; height: 13px; fill: #fff; }
    .play-btn.playing .ic-play { display: none; }
    .play-btn.playing .ic-pause { display: block; }
    .play-btn:not(.playing) .ic-play { display: block; }
    .play-btn:not(.playing) .ic-pause { display: none; }
    .time {
      font-size: 12px; color: var(--text-dim);
      font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
    }
    .progress-container {
      width: 100%; height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px; overflow: hidden;
    }
    #progress {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 65%, #fff));
      border-radius: 99px;
      transition: width 0.3s linear;
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 45%, transparent);
    }
    #card.playing .art-wrap {
      box-shadow: 0 8px 28px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .hide-art .art-wrap { display: none !important; }
    .hide-progress .progress-container { display: none !important; }
    .hide-time .time { display: none !important; }
    .hide-play .play-btn { display: none !important; }
    .hide-artist #artist { display: none !important; }
    .hide-viz .viz { display: none !important; }
    .viz {
      display: flex; align-items: flex-end; gap: 3px;
      height: 32px; padding: 6px 8px 5px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
    }
    .viz span {
      flex: 1; min-height: 3px; border-radius: 3px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent 38%),
        linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 30%, transparent));
      box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 35%, transparent);
    }
  </style>
</head>
<body>
  <div id="card" class="hidden">
    <div class="top">
      <div class="art-wrap">
        <img id="art" alt="" />
        <div class="art-placeholder" id="placeholder">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
      </div>
      <div class="meta">
        <div id="title">—</div>
        <div id="artist">—</div>
        <div class="controls">
          <div class="play-btn" id="playBtn">
            <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </div>
          <div class="time" id="time">0:00 / 0:00</div>
        </div>
      </div>
    </div>
    <div class="progress-container"><div id="progress"></div></div>
    <div class="viz" id="viz"></div>
  </div>

  <script>
    const DEFAULTS = {
      source: "any",
      accent: "#1DB954",
      glassOpacity: 0.78,
      radius: 20,
      artSize: 76,
      cardWidth: 420,
      showArt: true,
      showProgress: true,
      showTime: true,
      showPlay: true,
      showArtist: true,
      showViz: false,
      endpoint: "http://127.0.0.1:8123/now-playing"
    };

    let config = { ...DEFAULTS };

    function applyConfig(cfg) {
      config = { ...DEFAULTS, ...cfg };
      const r = document.documentElement;
      r.style.setProperty("--accent", config.accent);
      r.style.setProperty("--glass", `rgba(16, 16, 18, ${config.glassOpacity})`);
      r.style.setProperty("--radius", config.radius + "px");
      r.style.setProperty("--art-size", config.artSize + "px");
      r.style.setProperty("--card-width", config.cardWidth + "px");

      const card = document.getElementById("card");
      card.classList.toggle("hide-art", !config.showArt);
      card.classList.toggle("hide-progress", !config.showProgress);
      card.classList.toggle("hide-time", !config.showTime);
      card.classList.toggle("hide-play", !config.showPlay);
      card.classList.toggle("hide-artist", !config.showArtist);
      card.classList.toggle("hide-viz", !config.showViz);
    }

    function loadFromHash() {
      try {
        const hash = location.hash.slice(1);
        if (!hash) return;
        const json = decodeURIComponent(escape(atob(hash)));
        applyConfig(JSON.parse(json));
      } catch {}
    }

    // Live updates from parent customizer (no iframe reload)
    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "np-config") {
        applyConfig(e.data.config);
      }
    });

    loadFromHash();
    window.addEventListener("hashchange", loadFromHash);

    const SOURCE_MATCHERS = {
      spotify: (a) => (a || "").toLowerCase().includes("spotify"),
      apple: (a) => {
        const x = (a || "").toLowerCase();
        return (x.includes("music") || x.includes("itunes")) && !x.includes("youtube");
      },
      youtube: (a) => {
        const x = (a || "").toLowerCase();
        return x.includes("chrome") || x.includes("safari") || x.includes("firefox") ||
               x.includes("brave") || x.includes("edge") || x.includes("youtube");
      },
      nuclear: (a) => (a || "").toLowerCase().includes("nuclear"),
      any: () => true
    };

    const card = document.getElementById("card");
    const titleEl = document.getElementById("title");
    const artistEl = document.getElementById("artist");
    const artEl = document.getElementById("art");
    const placeholder = document.getElementById("placeholder");
    const progressEl = document.getElementById("progress");
    const playBtn = document.getElementById("playBtn");
    const timeEl = document.getElementById("time");

    // ===== Voice / audio visualizer (bottom of card) =====
    // Simulated waveform — the widget has no access to system audio,
    // so bars dance when music is playing and sit idle when paused.
    const BAR_COUNT = 28;
    const viz = document.getElementById("viz");
    const vizBars = [];
    const vizHeights = new Array(BAR_COUNT).fill(0);
    let vizPlaying = false;
    for (let i = 0; i < BAR_COUNT; i++) {
      const s = document.createElement("span");
      viz.appendChild(s);
      vizBars.push(s);
    }
    function vizTick(ts) {
      const t = ts * 0.001;
      // Slow "energy" envelope so it breathes like real audio.
      const breathe = vizPlaying ? 0.55 + 0.45 * ((Math.sin(t * 1.7) + 1) / 2) : 0.07;
      for (let i = 0; i < BAR_COUNT; i++) {
        const wave = (Math.sin(t * 3.1 + i * 0.45) + 1) / 2;   // smooth per-bar wave
        const jitter = vizPlaying ? 0.25 + Math.random() * 0.55 : 0.02 + Math.random() * 0.06;
        const target = Math.min(1, wave * 0.55 + jitter) * breathe;
        vizHeights[i] += (target - vizHeights[i]) * 0.35;
        vizBars[i].style.height = (3 + vizHeights[i] * 22).toFixed(1) + "px";
      }
      requestAnimationFrame(vizTick);
    }
    requestAnimationFrame(vizTick);

    let lastTrackKey = "";
    let lastArt = "";
    let anchorPos = 0;     // last trustworthy position (ms)
    let anchorTime = 0;    // when we learned it (Date.now)
    let lastServerPos = null; // previous bridge position (to detect "moved")
    let currentDur = 0;
    let isPlaying = false;
    let progressTimer = null;
    let pollBusy = false;

    // Accurate clock: instead of adding "+1000 every second" (which drifts),
    // anchor to the bridge position and compute elapsed time from Date.now().
    function positionNow() {
      if (!isPlaying || !anchorTime) return anchorPos;
      return Math.min(anchorPos + (Date.now() - anchorTime), currentDur || Infinity);
    }

    function formatTime(ms) {
      if (!ms || ms < 0) return "0:00";
      const s = Math.floor(ms / 1000);
      return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, "0")}`;
    }

    function updateProgress() {
      if (currentDur <= 0) {
        progressEl.style.width = "0%";
        timeEl.textContent = "0:00 / 0:00";
        return;
      }
      const pos = Math.min(positionNow(), currentDur);
      progressEl.style.width = Math.min(100, (pos / currentDur) * 100) + "%";
      timeEl.textContent = `${formatTime(pos)} / ${formatTime(currentDur)}`;
    }

    function clearArt() {
      artEl.removeAttribute("src");
      artEl.style.display = "none";
      placeholder.style.display = "flex";
      lastArt = "";
    }

    function showCard(data) {
      const match = SOURCE_MATCHERS[config.source] || SOURCE_MATCHERS.any;
      if (!match(data.app)) {
        hideCard();
        return;
      }

      const title = data.title || "Unknown";
      const artist = data.artist || "Unknown Artist";
      // Composite key: the artist can arrive a poll after the title,
      // so we refresh on ANY change — never show a stale author.
      const trackKey = title + "‖" + artist;

      if (trackKey !== lastTrackKey) {
        titleEl.textContent = title;
        artistEl.textContent = artist;
        lastTrackKey = trackKey;
        clearArt();
        anchorPos = data.position_ms || 0;
        anchorTime = Date.now();
        lastServerPos = data.position_ms || 0;
      }

      if (data.art && data.art !== lastArt) {
        artEl.src = data.art;
        artEl.style.display = "block";
        placeholder.style.display = "none";
        lastArt = data.art;
      }

      isPlaying = !!data.playing;
      currentDur = data.duration_ms || 0;
      const serverPos = data.position_ms || 0;
      const moved = serverPos !== lastServerPos;

      if (isPlaying) {
        const est = positionNow();
        if (!anchorTime) {
          // No anchor yet (first load) — bootstrap from the source.
          anchorPos = serverPos;
          anchorTime = Date.now();
        } else if (moved) {
          // The source reported a NEW reading. media-control updates in
          // chunks and freezes for seconds, so we only:
          //  - snap FORWARD when it's clearly ahead (catch-up / seek-fwd)
          //  - snap BACK only on a real big jump (seek-back / loop)
          // Never snap to a frozen value — that caused the stutter.
          const err = serverPos - est;
          if (err > 1200 || err < -8000) {
            anchorPos = serverPos;
            anchorTime = Date.now();
          }
        }
        if (currentDur > 0) anchorPos = Math.min(anchorPos, currentDur);
      } else {
        // Paused: pin the clock at the interpolated position — no yanking.
        if (anchorTime) {
          anchorPos = positionNow();
          anchorTime = Date.now();
        }
      }
      lastServerPos = serverPos;

      vizPlaying = isPlaying;
      playBtn.classList.toggle("playing", isPlaying);
      card.classList.toggle("playing", isPlaying);
      updateProgress();

      if (progressTimer) clearInterval(progressTimer);
      if (isPlaying && currentDur > 0) {
        // Render at 2 Hz from the anchor clock; the bridge re-syncs every poll.
        progressTimer = setInterval(updateProgress, 500);
      }

      card.classList.remove("hidden");
      card.classList.add("visible");
    }

    function hideCard() {
      card.classList.remove("visible");
      card.classList.add("hidden");
      lastTrackKey = "";
      clearArt();
      anchorPos = 0;
      anchorTime = 0;
      lastServerPos = null;
      vizPlaying = false;
      if (progressTimer) {
        clearInterval(progressTimer);
        progressTimer = null;
      }
    }

    async function poll() {
      if (pollBusy) return;
      pollBusy = true;
      try {
        const res = await fetch(config.endpoint, { cache: "no-store" });
        if (!res.ok) throw new Error();
        const data = await res.json();
        if (data && data.title) showCard(data);
        else hideCard();
      } catch {
        hideCard();
      } finally {
        pollBusy = false;
      }
    }

    // ---- LIVE POLLING VIA WEB WORKER ----
    // Browsers throttle plain setInterval in the background, which froze the
    // widget whenever the tab or OBS scene wasn't focused. Worker timers are
    // never throttled, so the card stays live no matter what.
    let worker = (typeof Worker !== "undefined")
      ? (() => {
          try {
            const code = [
              "let endpoint = '';",
              "let timer = null;",
              "let busy = false;",
              "self.onmessage = function (e) {",
              "  if (!e.data || e.data.type !== 'config') return;",
              "  endpoint = e.data.endpoint;",
              "  if (timer) return;",
              "  timer = setInterval(async function () {",
              "    if (!endpoint || busy) return;",
              "    busy = true;",
              "    try {",
              "      const res = await fetch(endpoint, { cache: 'no-store' });",
              "      if (!res.ok) throw new Error('http ' + res.status);",
              "      const data = await res.json();",
              "      self.postMessage({ ok: true, data: data });",
              "    } catch (err) {",
              "      self.postMessage({ ok: false });",
              "    } finally {",
              "      busy = false;",
              "    }",
              "  }, 1600);",
              "};",
            ].join("\n");
            const w = new Worker(URL.createObjectURL(new Blob([code], { type: "application/javascript" })));
            w.onmessage = function (e) {
              if (e.data && e.data.ok && e.data.data && e.data.data.title) showCard(e.data.data);
              else hideCard();
            };
            w.onerror = function () {
              // Worker failed to load/run (CSP etc.) — fall back to a plain loop.
              if (w) w.terminate();
              worker = null;
              poll();
              setInterval(poll, 1600);
            };
            return w;
          } catch (err) {
            return null;
          }
        })()
      : null;

    function syncWorkerEndpoint() {
      if (worker) worker.postMessage({ type: "config", endpoint: config.endpoint });
    }

    if (worker) {
      syncWorkerEndpoint();
      // Keep the worker pointed at the right endpoint if the config changes.
      const _applyConfig = applyConfig;
      window.applyConfig = function (cfg) {
        _applyConfig(cfg);
        syncWorkerEndpoint();
      };
    } else {
      // Fallback for exotic embedders without Worker support.
      poll();
      setInterval(poll, 1600);
    }
  </script>
</body>
</html>
